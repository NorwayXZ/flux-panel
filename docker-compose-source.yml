# Compatibility entry point for update workers installed before 2.2.0.
# Development source builds use docker-compose-build.yml.
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:5.7}
    container_name: gost-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./gost.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=${MYSQL_MAX_CONNECTIONS:-200}
      --innodb_buffer_pool_size=${MYSQL_BUFFER_POOL_SIZE:-128M}
    networks:
      - gost-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/norwayxz}/flux-panel-backend:${PANEL_VERSION:-2.22.2}
    container_name: springboot-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      LOG_DIR: /app/logs
      JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      TOMCAT_MIN_SPARE_THREADS: ${TOMCAT_MIN_SPARE_THREADS:-2}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-100}
      TOMCAT_MAX_CONNECTIONS: ${TOMCAT_MAX_CONNECTIONS:-512}
      TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-100}
      MONITORING_SCAN_INTERVAL_MS: ${MONITORING_SCAN_INTERVAL_MS:-30000}
      MONITORING_RETENTION_DAYS: ${MONITORING_RETENTION_DAYS:-90}
      FORWARD_HEALTH_CHECK_INTERVAL_MS: ${FORWARD_HEALTH_CHECK_INTERVAL_MS:-60000}
      FORWARD_FAILURE_THRESHOLD: ${FORWARD_FAILURE_THRESHOLD:-2}
      FORWARD_RECOVERY_THRESHOLD: ${FORWARD_RECOVERY_THRESHOLD:-2}
      FORWARD_SWITCH_COOLDOWN_MS: ${FORWARD_SWITCH_COOLDOWN_MS:-120000}
      FORWARD_FAILBACK_STABLE_MS: ${FORWARD_FAILBACK_STABLE_MS:-180000}
      FORWARD_LATENCY_SWITCH_GAP_MS: ${FORWARD_LATENCY_SWITCH_GAP_MS:-15}
    ports:
      - "${BACKEND_PORT}:6365"
    volumes:
      - backend_logs:/app/logs
      - /var/lib/flux-panel-updater:/var/lib/flux-panel-updater
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gost-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:6365/flow/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/norwayxz}/flux-panel-frontend:${PANEL_VERSION:-2.22.2}
    container_name: vite-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gost-network

volumes:
  mysql_data:
    name: mysql_data
  backend_logs:
    name: backend_logs

networks:
  gost-network:
    name: gost-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
