name: Release Flux Panel

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/norwayxz/flux-panel-backend
  FRONTEND_IMAGE: ghcr.io/norwayxz/flux-panel-frontend

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Test deployment scripts and Compose files
        run: |
          sh scripts/check-version-consistency.sh
          sh scripts/test-agent-installer.sh
          bash scripts/test-runtime-healthcheck.sh
          sh scripts/check-runtime-safety.sh
          bash scripts/test-auto-update-check.sh
          sudo bash scripts/test-panel-manager.sh
          test ! -e panel_install.sh
          test ! -e docker-compose-v4.yml
          test ! -e docker-compose-v6.yml
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f docker-compose-source.yml config --quiet
          docker compose --env-file .env.example -f docker-compose-build.yml config --quiet

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package backend
        working-directory: springboot-backend
        env:
          LOG_DIR: /tmp/flux-panel-logs
          JWT_SECRET: test-only-secret-with-sufficient-length-123456
          DB_HOST: 127.0.0.1
          DB_NAME: test
          DB_USER: test
          DB_PASSWORD: test
        run: mvn --batch-mode clean package

      - name: Smoke test backend runtime
        run: bash scripts/test-backend-runtime.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: vite-frontend/package-lock.json

      - name: Test and build frontend
        working-directory: vite-frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-gost/go.mod
          cache-dependency-path: go-gost/go.sum

      - name: Test and build Agent
        working-directory: go-gost
        run: |
          set -euo pipefail
          go test ./...
          (cd x && go test ./...)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../gost-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../gost-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../gost-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../gost-windows-arm64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../gost-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../gost-darwin-arm64 .
          cd ..
          expected_agent_version="$(tr -d '[:space:]' < AGENT_VERSION)"
          actual_agent_version="$(./gost-amd64 --agent-version)"
          if [[ "$actual_agent_version" != "$expected_agent_version" ]]; then
            echo "Agent binary reports $actual_agent_version, expected $expected_agent_version" >&2
            exit 1
          fi
          sha256sum gost-amd64 gost-arm64 gost-windows-amd64.exe gost-windows-arm64.exe gost-darwin-amd64 gost-darwin-arm64 > SHA256SUMS

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend runtime images
        uses: docker/build-push-action@v7
        with:
          context: springboot-backend
          file: springboot-backend/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-runtime
          cache-to: type=gha,mode=max,scope=backend-runtime

      - name: Build and push frontend runtime images
        uses: docker/build-push-action@v7
        with:
          context: vite-frontend
          file: vite-frontend/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend-runtime
          cache-to: type=gha,mode=max,scope=frontend-runtime

      - name: Verify runtime image contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "${BACKEND_IMAGE}:${VERSION}"
          docker pull "${FRONTEND_IMAGE}:${VERSION}"
          docker run --rm --entrypoint sh "${BACKEND_IMAGE}:${VERSION}" -c \
            "test -x /app/healthcheck.sh && grep -aq 'RuntimeHealthController.class' /app/app.jar && grep -aq 'NodeServiceDiscoveryService.class' /app/app.jar && grep -aq 'QualityLabService.class' /app/app.jar && grep -aq 'ProtocolProbeService.class' /app/app.jar && grep -aq 'BandwidthTestService.class' /app/app.jar && grep -aq 'UdpQuicDiagnosticService.class' /app/app.jar && grep -aq 'VirtualLanService.class' /app/app.jar && grep -aq 'PrivateNetworkService.class' /app/app.jar && grep -aq 'NetworkRouteApplicationService.class' /app/app.jar && grep -aq 'CloudFrontXhttpService.class' /app/app.jar && grep -aq 'AwsAccessService.class' /app/app.jar && grep -aq 'NftForwardService.class' /app/app.jar && grep -aq 'MultiLineAggregationService.class' /app/app.jar && grep -aq 'DockerAppCenterService.class' /app/app.jar"
          docker run --rm --entrypoint sh "${FRONTEND_IMAGE}:${VERSION}" -c \
            "grep -Rqs '发现服务' /usr/share/nginx/html/assets && grep -Rqs '协议测速中心' /usr/share/nginx/html/assets && grep -Rqs '网络质量实验室' /usr/share/nginx/html/assets && grep -Rqs '真实带宽测试中心' /usr/share/nginx/html/assets && grep -Rqs 'UDP / QUIC 诊断' /usr/share/nginx/html/assets && grep -Rqs '多线路并发调度' /usr/share/nginx/html/assets && grep -Rqs '线路调度中心' /usr/share/nginx/html/assets && grep -Rqs '内网组建与出口' /usr/share/nginx/html/assets && grep -Rqs 'VLESS + XHTTP + TLS' /usr/share/nginx/html/assets && grep -Rqs 'AWS 账号' /usr/share/nginx/html/assets && grep -Rqs 'nftables 端口转发' /usr/share/nginx/html/assets && grep -Rqs 'Docker 应用中心' /usr/share/nginx/html/assets"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            gost-amd64 gost-arm64 \
            gost-windows-amd64.exe gost-windows-arm64.exe \
            gost-darwin-amd64 gost-darwin-arm64 \
            SHA256SUMS install.sh install-connector.ps1 install-connector-macos.sh \
            --verify-tag \
            --title "Flux Panel ${VERSION}" \
            --notes-file .github/release-notes.md
